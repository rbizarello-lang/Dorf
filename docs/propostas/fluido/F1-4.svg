<text x="400" y="90" text-anchor="start" fill="#3b3b32" font-size="12" >losango gordo (72°)</text>
<text x="400" y="110" text-anchor="start" fill="#3b3b32" font-size="12" >losango fino (36°)</text>
<text x="400" y="150" text-anchor="start" fill="#3b3b32" font-size="12" >todos os lados iguais:</text>
<text x="400" y="168" text-anchor="start" fill="#3b3b32" font-size="12" >qualquer lado aceita</text>
<text x="400" y="186" text-anchor="start" fill="#3b3b32" font-size="12" >qualquer losango.</text>
<text x="400" y="214" text-anchor="start" fill="#3b3b32" font-size="12" >o ângulo livre decide</text>
<text x="100" y="25" text-anchor="start" fill="#3b3b32" font-size="13" font-weight="bold">Losangos de Penrose: 5 gordos + 5 finos</text>
</svg>
