<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240"><defs></defs><rect width="400" height="240" fill="#ece7d6"/><rect x="30" y="40" width="200" height="50" fill="#8dbb5a"/><rect x="30" y="90" width="200" height="50" fill="#3f7a45"/><rect x="250" y="40" width="130" height="50" fill="#8dbb5a"/><path d="M250,90 C280,90 290,60 320,60 C350,60 360,90 380,90 L380,140 L250,140Z" fill="#3f7a45"/><path d="M250,90 C280,90 290,60 320,60 C350,60 360,90 380,90" stroke="#fff" stroke-width="3" fill="none"/><line x1="30" y1="90" x2="230" y2="90" stroke="#fff" stroke-width="3"/><text x="130" y="65" font-size="12" text-anchor="middle" fill="#333" font-family="sans-serif" >antes: divisa reta</text><text x="315" y="40" font-size="1" text-anchor="middle" fill="#333" font-family="sans-serif" ></text><text x="315" y="160" font-size="12" text-anchor="middle" fill="#333" font-family="sans-serif" >depois: a mata avança 30%</text><text x="130" y="160" font-size="12" text-anchor="middle" fill="#333" font-family="sans-serif" >mata 3 peças x prado 1</text><path d="M320,115 L320,75" stroke="#fff" stroke-width="3"/><polygon points="314,80 320,68 326,80" fill="#fff"/><text x="200" y="24" font-size="14" text-anchor="middle" fill="#333" font-family="sans-serif" font-weight="bold">Argila: a divisa cede para o lado que tem mais massa</text><text x="200" y="200" font-size="12" text-anchor="middle" fill="#666" font-family="sans-serif" >área de cada mancha, não contagem de bordas: +1 ponto por 10% de área</text><text x="200" y="220" font-size="12" text-anchor="middle" fill="#666" font-family="sans-serif" >só no sombreador de costura: a geometria não muda</text></svg>