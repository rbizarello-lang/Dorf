<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8fcbe6" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='14' r='11' fill='%23ffb84a' opacity='.35'/%3E%3Crect x='11' y='8' width='10' height='12' rx='4' fill='%23ffe08a' stroke='%23d9941d' stroke-width='1.5'/%3E%3Crect x='15' y='20' width='2' height='9' fill='%234d3326'/%3E%3C/svg%3E" />
  <title>Ilha das Lanternas</title>
</head>
<body>
  <main>
    <div id="hud-top">
      <section id="res" class="panel" aria-label="Recursos e moradores"></section>
      <section id="clock" class="panel" aria-label="Turno e hora do dia">
        <div class="t"><span id="turnTxt"></span><em id="dayTxt"></em></div>
        <div style="position:relative"><div id="ruler"></div><div id="sun" aria-hidden="true"></div></div>
        <div id="marks"></div>
        <div class="need" id="need"></div>
      </section>
      <section id="goals" class="panel" aria-label="Metas"></section>
    </div>
    <div id="toast" class="panel" role="status" aria-live="polite"></div>
    <div id="hand-wrap">
      <div id="info" aria-live="polite"></div>
      <div id="hand" role="group" aria-label="Cartas na mão">
        <button id="wind" class="act wind" type="button" aria-pressed="false" aria-disabled="false"></button>
        <button id="discard" class="act" type="button" disabled>Descartar<small>+1 <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c3.2 4.2 6 7.4 6 11a6 6 0 0 1-12 0c0-3.6 2.8-6.8 6-11z" fill="#e89a2e"/></svg> óleo</small></button>
      </div>
    </div>
    <aside id="end" class="panel" aria-label="Fim da temporada">
      <h2>Fim da temporada</h2>
      <p class="lead">A ilha dorme com as luzes que você acendeu.</p>
      <div id="endBody"></div>
      <button id="again" class="act primary" type="button">Nova ilha</button>
    </aside>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
