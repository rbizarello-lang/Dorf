:flex;gap:6px;flex-wrap:wrap}#goals li{display:flex;gap:5px;align-items:center;padding:2px 8px 2px 4px;border-radius:6px;background:var(--wood-3);border:1px solid var(--brass-lo)}#goals .box{width:16px;height:16px;border-width:1.5px}#goals .box svg{width:10px;height:10px}#goals .nm{font-size:12px}#goals .nu{font-size:11px}#goals .bar{display:none}#clock{order:3;padding:7px 10px 5px}#clock .need{display:none}#ruler{margin:6px 0 2px}#marks{height:14px}#toast{top:150px}#hand-wrap{bottom:8px;gap:6px}#info{font-size:12.5px;padding:4px 10px;min-height:0}#info{align-self:flex-start;margin-left:8px;max-width:calc(100vw - 188px);text-align:left}#hand{gap:6px;position:relative;padding:0 8px;width:100%;justify-content:center}.card{width:calc((100vw - 16px - 12px) / 3);max-width:150px;border-radius:7px;padding:4px}.card .art{height:44px}.card .art svg{width:38px;height:38px}.card .key{display:none}.card .nm{font-size:14.5px;flex-wrap:wrap}.card .body{padding:5px 4px 4px}.card .why{font-size:11px}.card .fx{font-size:11px;line-height:1.2;margin-top:2px;font-weight:500}.card .where{display:none}.card.sel{transform:translateY(-8px)}#wind{position:fixed;right:18px;top:17px;margin:0;padding:5px 7px;z-index:2}#wind .ic{width:24px;height:24px}#wind .wl{display:none}#discard{position:absolute;right:8px;top:-42px;margin:0;flex-direction:row;gap:6px;padding:5px 10px}#discard small{font-size:11px}#end{inset:auto 8px 8px;width:auto;transform:translateY(30px);padding:12px 14px}#end.on{transform:none}#end h2{font-size:20px}#end .lead{display:none}#end .big{font-size:44px}#end ul{margin:6px 0;font-size:13px}#menuPop{top:auto;left:auto;right:8px;transform:none}#escolha .pair{gap:10px}#escolha .isle svg{width:70px;height:44px}}@media(prefers-reduced-motion:reduce){.card,.card.deal,.float,#toast,#end,#dica,#goals .bar i,#sun,#wind{animation:none!important;transition:none!important}.float{margin-top:-24px;opacity:1;animation:none}}</style>
</head>
<body>
  <main>
    <div id="hud-top">
      <section id="res" class="panel" aria-label="Recursos e moradores"></section>
      <section id="clock" class="panel" aria-label="Turno e hora do dia">
        <div class="t"><span id="turnTxt"></span><em id="dayTxt"></em><button id="menuBtn" class="gear" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button></div>
        <div style="position:relative"><div id="ruler"></div><div id="sun" aria-hidden="true"></div></div>
        <div id="marks"></div>
        <div class="need" id="need"></div>
      </section>
      <section id="goals" class="panel" aria-label="Metas"></section>
    </div>
    <div id="menuPop" class="panel" role="menu" aria-label="Menu do jogo">
      <div id="mInfo" class="mi"></div>
      <button id="mNew" class="act" type="button" role="menuitem">Nova partida</button>
      <button id="mChoose" class="act" type="button" role="menuitem">Escolher outra ilha</button>
      <button id="mSkip" class="act" type="button" role="menuitem">Pular dicas</button>
      <button id="mExport" class="act quiet" type="button" role="menuitem">Exportar minha sessão</button>
    </div>
    <div id="toast" class="panel" role="status" aria-live="polite"></div>
    <div id="hand-wrap">
      <div id="dica" role="status" aria-live="polite"><span id="dicaTxt"></span><button id="dicaSkip" type="button">Pular dicas</button></div>
      <div id="info" aria-live="polite"></div>
      <div id="hand" role="group" aria-label="Peças na mão">
        <button id="wind" class="act wind" type="button" aria-pressed="false" aria-disabled="false"></button>
        <button id="discard" class="act" type="button" disabled>Descartar<small>+1 <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c3.2 4.2 6 7.4 6 11a6 6 0 0 1-12 0c0-3.6 2.8-6.8 6-11z" fill="#e89a2e"/></svg> óleo</small></button>
      </div>
    </div>
    <aside id="end" class="panel" aria-label="Fim da partida">
      <h2>Noite na ilha</h2>
      <p class="lead">A ilha dorme com as luzes que você acendeu.</p>
      <div id="endBody"></div>
      <button id="again" class="act primary" type="button">Nova partida</button>
      <button id="other" class="act quiet" type="button">Escolher outra ilha</button>
    </aside>
  </main>
  <section id="escolha" aria-label="Escolha uma ilha">
    <div class="plate">
      <svg class="lamp" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="24" r="22" fill="#ffb84a" opacity=".22"/><circle cx="32" cy="24" r="13" fill="#ffb84a" opacity=".3"/><rect x="30" y="32" width="4" height="26" rx="1.5" fill="#6b4a32"/><rect x="23" y="55" width="18" height="4" rx="1.5" fill="#c9a04a"/><path d="M21 19 32 9l11 10z" fill="#c9a04a"/><rect x="23" y="18" width="18" height="17" rx="5" fill="#ffe08a" stroke="#c9a04a" stroke-width="2"/><path d="M23 27h18" stroke="#c9a04a" stroke-width="1.4"/></svg>
      <h1>Ilha das Lanternas</h1>
      <p class="sub">Duas ilhas esperam por você. Escolha uma e descubra jogando.</p>
      <div class="pair">
        <button id="ilha1" class="isle" type="button"><svg viewBox="0 0 64 40" aria-hidden="true"><path d="M32 4 58 12v16L32 36 6 28V12z" fill="#a4d063" stroke="#6a4d34" stroke-width="2.4" stroke-linejoin="round"/><path d="M6 28 32 36l26-8v5L32 41 6 33z" fill="#8b6a47"/><circle cx="32" cy="14" r="3.4" fill="#ffe08a" stroke="#c9a04a" stroke-width="1.4"/></svg><b>Ilha 1</b><small>Toque para jogar</small></button>
        <button id="ilha2" class="isle" type="button"><svg viewBox="0 0 64 40" aria-hidden="true"><path d="M32 4 58 12v16L32 36 6 28V12z" fill="#a4d063" stroke="#6a4d34" stroke-width="2.4" stroke-linejoin="round"/><path d="M6 28 32 36l26-8v5L32 41 6 33z" fill="#8b6a47"/><circle cx="32" cy="14" r="3.4" fill="#ffe08a" stroke="#c9a04a" stroke-width="1.4"/></svg><b>Ilha 2</b><small>Toque para jogar</small></button>
      </div>
      <p class="foot">Uma partida leva de 10 a 15 minutos.</p>
    </div>
  </section>
  <div id="exp" role="dialog" aria-modal="true" aria-label="Exportar minha sessão">
    <div class="panel box">
      <h2>Exportar minha sessão</h2>
      <p id="expMsg" class="m"></p>
      <textarea id="expTxt" readonly spellcheck="false" aria-label="Texto da sessão"></textarea>
      <div class="bt"><button id="expCopy" class="act primary" type="button">Copiar</button><button id="expClose" class="act" type="button">Fechar</button></div>
    </div>
  </div>
  <div id="fps" aria-hidden="true"></div>
</body>
</html>
