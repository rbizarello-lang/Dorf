<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Província</title>
<style>
  :root {
    --bg: #1a120c; --ink: #efe2c4; --ink-dim: #b8a684; --brass: #d4a64a; --brass-dk: #8a6a2a; --walnut: #2a1b12;
    --serif: "Palatino Linotype", "Book Antiqua", Palatino, "URW Palladio L", "Liberation Serif", Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--serif); overflow: hidden; -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 34%, #5a4330 0%, #2a1d14 52%, #0f0a07 100%); }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }

  .title { position: fixed; left: 24px; top: 20px; pointer-events: none; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  .title b { font-weight: 400; font-style: italic; font-size: 21px; letter-spacing: .03em; color: var(--ink); }
  .title span { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-dim); margin-top: 3px; }

  .panel { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 22px; align-items: stretch; padding: 12px 18px 12px;
    background: linear-gradient(180deg, rgba(58,40,26,.88), rgba(30,20,13,.92)); border: 1px solid rgba(212,166,74,.55); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,225,160,.18), inset 0 0 0 4px rgba(0,0,0,.12); backdrop-filter: blur(6px); max-width: calc(100vw - 24px); }
  .grp { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .lbl { font-family: var(--mono); font-size: 9.5px; letter-spacing: .24em; text-transform: uppercase; color: var(--ink-dim); }
  .sep { width: 1px; background: linear-gradient(180deg, transparent, rgba(212,166,74,.5), transparent); }

  .seg { position: relative; display: inline-flex; padding: 3px; border-radius: 10px; background: #150e09; border: 1px solid rgba(212,166,74,.35); box-shadow: inset 0 2px 6px rgba(0,0,0,.6); }
  .seg button { position: relative; z-index: 1; appearance: none; background: none; border: 0; color: var(--ink-dim); font: 600 13px/1 var(--serif); letter-spacing: .03em; padding: 9px 16px; min-width: 92px; cursor: pointer; border-radius: 8px; transition: color .25s; white-space: nowrap; }
  .seg button[aria-pressed="true"] { color: #2a1b0a; }
  .seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 8px; background: linear-gradient(180deg, #f0cc7a, #c69a3c 60%, #a9802c); box-shadow: 0 2px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,245,200,.7); transition: transform .35s cubic-bezier(.3,1.3,.5,1), width .3s; }
  .seg button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .seg button svg { width: 15px; height: 15px; vertical-align: -3px; margin-right: 6px; }
  .read { font-family: var(--mono); font-size: 11px; color: var(--ink); letter-spacing: .04em; min-height: 14px; }
  .read i { font-style: normal; color: var(--brass); }

  #tip { position: fixed; pointer-events: none; transform: translate(14px, 16px); background: rgba(24,16,10,.92); border: 1px solid rgba(212,166,74,.6); border-radius: 8px; padding: 7px 11px; opacity: 0; transition: opacity .12s; z-index: 5; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
  #tip b { display: block; font: italic 400 16px var(--serif); color: var(--ink); }
  #tip span { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass); }
  #tip.vazia span { color: var(--ink-dim); }

  #plaques { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .plaque { position: absolute; transform: translate(-50%, -100%); font: italic 400 14px var(--serif); color: #fbf0d4; text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 10px rgba(0,0,0,.6); white-space: nowrap; transition: opacity .3s; }
  .plaque::after { content: ""; display: block; width: 1px; height: 12px; margin: 2px auto 0; background: linear-gradient(180deg, rgba(251,240,212,.8), transparent); }
  .plaque.cap { font-size: 16px; letter-spacing: .08em; }

  .hint { position: fixed; right: 20px; top: 22px; text-align: right; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); opacity: .8; pointer-events: none; line-height: 1.7; }
  #dbg { position: fixed; left: 24px; top: 70px; font: 11px var(--mono); color: var(--ink-dim); white-space: pre; pointer-events: none; }
  .ui-off .panel, .ui-off .title, .ui-off .hint, .ui-off #plaques { display: none; }
  @media (max-width: 760px) {
    .panel { flex-direction: column; gap: 10px; bottom: 12px; padding: 10px 12px; width: calc(100vw - 20px); }
    .sep { display: none; } .seg button { min-width: 0; padding: 9px 10px; flex: 1; font-size: 12px; } .seg { width: 100%; }
    .hint { display: none; } .title { left: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .seg .thumb { transition: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="plaques"></div>
<div class="title"><b>Província</b><span>(esboço visual)</span></div>
<div class="hint">arraste · gira<br>roda · aproxima<br>botão direito · move</div>
<div id="tip"><b></b><span></span></div>
<div class="panel" role="group" aria-label="Controles da província">
  <div class="grp">
    <div class="lbl">Tempo de jogo</div>
    <div class="seg" id="weeks" role="group" aria-label="Semana">
      <div class="thumb"></div>
      <button data-w="1" aria-pressed="false">Semana 1</button>
      <button data-w="4" aria-pressed="true">Semana 4</button>
    </div>
    <div class="read" id="readWeek"></div>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <div class="lbl">Hora do dia</div>
    <div class="seg" id="hours" role="group" aria-label="Hora do dia">
      <div class="thumb"></div>
      <button data-h="dia" aria-pressed="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>Dia</button>
      <button data-h="entardecer" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 11a5 5 0 0 1 10 0M1 11h14M4 14h8M8 2.5v2M2.8 5.3l1.3 1.3M13.2 5.3l-1.3 1.3"/></svg>Entardecer</button>
      <button data-h="noite" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 10.2A5.5 5.5 0 0 1 5.8 3.5a5.5 5.5 0 1 0 6.7 6.7z"/></svg>Noite</button>
    </div>
    <div class="read" id="readHour"></div>
  </div>
</div>
<div id="dbg"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
